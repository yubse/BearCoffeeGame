  <script>
    // 创建 MapLibre 地图实例
    const map = new maplibregl.Map({
      // 指定地图要显示在哪个 HTML 元素中，对应上面的 id="map"
      container: 'map',

      // 使用 MapTiler streets-v4 在线底图样式；如果 key 失效，地图底图会无法加载
      style: 'https://api.maptiler.com/maps/dataviz-v4/style.json?key=LNvapYnYvAycgHEiQP5X',

      // 设置地图初始中心点，经纬度格式是 [经度, 纬度]
      center: [114.16369, 22.77325],

      // 设置初始缩放级别，数字越大地图越近
      zoom: 9.6,

      // 允许用户手动放大到更近的门店视角
      maxZoom: 30
    });

    // 暴露到 window 上，方便在浏览器控制台里调试地图状态
    window.map = map;

    // 添加缩放和旋转控件，方便在浏览器中操作地图
    map.addControl(new maplibregl.NavigationControl(), 'top-right');

    // 计算一个 GeoJSON 几何图形的外接矩形，用于点击省份后自动放大到该省份范围
    function getGeometryBounds(geometry) {
      const bounds = new maplibregl.LngLatBounds();

      // 递归读取 Polygon / MultiPolygon 里的所有坐标点
      function extendBounds(coordinates) {
        if (typeof coordinates[0] === 'number') {
          bounds.extend(coordinates);
          return;
        }

        coordinates.forEach(extendBounds);
      }

      extendBounds(geometry.coordinates);
      return bounds;
    }

    function getFeatureCollectionBounds(featureCollection) {
      const bounds = new maplibregl.LngLatBounds();

      featureCollection.features.forEach((feature) => {
        if (feature.geometry?.type === 'Point') {
          bounds.extend(feature.geometry.coordinates);
          return;
        }

        if (feature.geometry?.coordinates) {
          getGeometryBounds(feature.geometry).toArray().forEach((coordinate) => {
            bounds.extend(coordinate);
          });
        }
      });

      return bounds;
    }

    const coffeeMarkers = [];
    let hasSelectedProvince = false;

    function normalizeCityName(cityName) {
      return String(cityName || '').replace(/市$/u, '');
    }

    function setCoffeeMarkersVisible(isVisible, cityName = '') {
      const normalizedTargetCity = normalizeCityName(cityName);

      coffeeMarkers.forEach(({ markerElement, feature }) => {
        const markerCity = normalizeCityName(feature.properties.city);
        const shouldShow = isVisible && (!normalizedTargetCity || markerCity === normalizedTargetCity);
        markerElement.classList.toggle('is-visible', shouldShow);
      });

      if (!isVisible) {
        closeCafeModal();
      }
    }

    function queryFeaturesAroundPoint(point, layerIds, radius = 8) {
      return map.queryRenderedFeatures([
        [point.x - radius, point.y - radius],
        [point.x + radius, point.y + radius]
      ], {
        layers: layerIds
      });
    }

    async function fetchJSONWithTimeout(url, timeout = 2400) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);

      try {
        const response = await fetch(url, {
          signal: controller.signal,
          cache: 'force-cache'
        });

        if (!response.ok) {
          throw new Error(`无法读取 ${url}`);
        }

        return await response.json();
      } finally {
        window.clearTimeout(timer);
      }
    }

    async function getVisitorLocationByIP() {
      const providers = [
        async () => {
          const data = await fetchJSONWithTimeout('https://ipapi.co/json/');
          return {
            countryCode: data.country_code,
            longitude: Number(data.longitude),
            latitude: Number(data.latitude)
          };
        },
        async () => {
          const data = await fetchJSONWithTimeout('https://ipwho.is/');
          return {
            countryCode: data.country_code,
            longitude: Number(data.longitude),
            latitude: Number(data.latitude)
          };
        }
      ];

      for (const provider of providers) {
        try {
          const location = await provider();
          if (location.countryCode || (Number.isFinite(location.longitude) && Number.isFinite(location.latitude))) {
            return location;
          }
        } catch (error) {
          // IP 定位失败时继续尝试下一个服务，全部失败再使用默认视角。
        }
      }

      return null;
    }

    function getVisitorLocationOnce() {
      if (!visitorLocationPromise) {
        visitorLocationPromise = getVisitorLocationByIP();
      }
      return visitorLocationPromise;
    }

    async function focusMapByVisitorCountry() {
      const location = await getVisitorLocationOnce();

      if (!location) {
        return false;
      }

      const countryCode = String(location.countryCode || '').toUpperCase();
      const preset = COUNTRY_VIEWPORTS[countryCode];

      if (preset) {
        map.easeTo({
          center: preset.center,
          zoom: preset.zoom,
          duration: 900,
          essential: true
        });
        return true;
      }

      if (Number.isFinite(location.longitude) && Number.isFinite(location.latitude)) {
        map.easeTo({
          center: [location.longitude, location.latitude],
          zoom: 4.6,
          duration: 900,
          essential: true
        });
        return true;
      }

      return false;
    }

    // 转义弹窗里的文字，避免地址或店名里有特殊字符时破坏 HTML
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));

    const imageLightbox = document.getElementById('image-lightbox');
    const lightboxImage = imageLightbox.querySelector('img');
    const lightboxClose = imageLightbox.querySelector('button');
    const cafeModal = document.getElementById('cafe-modal');
    const cafeModalPanel = document.getElementById('cafe-modal-panel');
    const cafeModalClose = document.getElementById('cafe-modal-close');
    const languageToggle = document.getElementById('language-toggle');

    function applyLanguageToPage() {
      const dictionary = I18N[currentLanguage];
      document.documentElement.lang = dictionary.htmlLang;
      document.title = dictionary.title;
      languageToggle.textContent = dictionary.toggle;
      languageToggle.setAttribute('aria-label', dictionary.toggleAria);
      cafeModalClose.setAttribute('aria-label', dictionary.closeModal);
      lightboxClose.setAttribute('aria-label', dictionary.closeImage);

      if (!lightboxImage.alt) {
        lightboxImage.alt = dictionary.imageAlt;
      }
    }

    function setLanguage(language) {
      const nextLanguage = language === 'en' ? 'en' : 'zh';
      if (currentLanguage === nextLanguage) {
        applyLanguageToPage();
        return;
      }

      currentLanguage = nextLanguage;
      applyLanguageToPage();

      if (activeCafeModalData && cafeModal.classList.contains('is-open')) {
        cafeModalPanel.replaceChildren(buildCafePopup(activeCafeModalData.feature, activeCafeModalData.cafeInfo));
      }
    }

    async function initializeLanguageByIP() {
      try {
        const location = await getVisitorLocationOnce();
        if (hasUserSelectedLanguage) {
          return;
        }
        const countryCode = String(location?.countryCode || '').toUpperCase();
        setLanguage(countryCode === 'CN' ? 'zh' : 'en');
      } catch (error) {
        if (hasUserSelectedLanguage) {
          return;
        }
        setLanguage('en');
      }
    }

    function openCafeModal(content, modalData = null) {
      activeCafeModalData = modalData;
      cafeModalPanel.replaceChildren(content);
      cafeModal.classList.add('is-open');
      cafeModal.setAttribute('aria-hidden', 'false');
    }

    function closeCafeModal() {
      cafeModal.classList.remove('is-open');
      cafeModal.setAttribute('aria-hidden', 'true');
      cafeModalPanel.replaceChildren();
      activeCafeModalData = null;
    }

    languageToggle.addEventListener('click', () => {
      hasUserSelectedLanguage = true;
      setLanguage(currentLanguage === 'zh' ? 'en' : 'zh');
    });
    applyLanguageToPage();
    initializeLanguageByIP();

    cafeModalClose.addEventListener('click', closeCafeModal);
    window.addEventListener('keydown', (event) => {

    });

    function openLightbox(src, alt) {

      imageLightbox.classList.add('is-open');

    // 复制店铺信息，供弹窗里的地址和电话调用
    function copyInfo(value, button) {
      const status = button.querySelector('.coffee-popup__copy-status') || button;

      navigator.clipboard.writeText(value).then(() => {
        status.textContent = t('copied');
      }).catch(() => {
        status.textContent = t('copyFailed');
      });
    }

    async function loadText(fileName, fallbackText = '') {
      try {
        const response = await fetch(fileName);

        if (!response.ok) {
          throw new Error(`无法读取 ${fileName}`);
        }

        return await response.text();
      } catch (error) {
        return fallbackText;
      }
    }

    function getFirstSentence(text) {
      const normalized = text.replace(/\s+/g, ' ').trim();
      const match = normalized.match(/^.*?[。！？!?]/);
      return match ? match[0] : normalized;
    }

    function parseCafeInfo(rawText, fallbackAddress = '') {
      const lines = rawText.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      const title = lines[0] || t('defaultCafeTitle');
      const xhsLine = lines.find((line) => /小红书|Xiaohongshu/i.test(line));
      const xhsUrl = xhsLine ? xhsLine.replace(/^.*?(https?:\/\/\S+)$/u, '$1') : '';
      const factLines = lines.filter((line) => /^[☕🌿🍰🍋📍🕘🕐☁📷]/u.test(line));
      const bodyLines = lines.filter((line, index) => {
        if (index === 0 || line === xhsLine) {
          return false;
        }
        return !factLines.includes(line);
      });

      const facts = {};
      factLines.forEach((line) => {
        const cleaned = line.replace(/^[☕🌿🍰🍋📍🕘🕐☁📷️\s]+/u, '');
        const separatorIndex = cleaned.search(/[：:]/u);
        if (separatorIndex === -1) {
          return;
        }
        const label = cleaned.slice(0, separatorIndex).trim();
        const value = cleaned.slice(separatorIndex + 1).trim();
        if (label && value) {
          facts[label] = facts[label] ? `${facts[label]} / ${value}` : value;
        }
      });

      return {
        title,
        intro: bodyLines.join('\n\n'),
        facts,
        address: facts['地址'] || fallbackAddress,
        xhsUrl
      };
    }

    function renderFact(label, value) {
      if (!value) {
        return '';
      }

      return `
        <div class="coffee-popup__fact">
          <div class="coffee-popup__label">${escapeHTML(label)}</div>
          <div class="coffee-popup__value">${escapeHTML(value)}</div>
        </div>
      `;
    }

    function renderCopyFact(label, values) {
      const items = Array.isArray(values) ? values.filter(Boolean) : [values].filter(Boolean);

      if (!items.length) {
        return '';
      }

      return `
        <div class="coffee-popup__fact">
          <div class="coffee-popup__label">${escapeHTML(label)}</div>
          <div class="coffee-popup__value">
            ${items.map((value) => `
              <button class="coffee-popup__copy-row" type="button" data-copy-value="${escapeHTML(value)}">
                <span>${escapeHTML(value)}</span>
                <span class="coffee-popup__copy-status">${escapeHTML(t('copy'))}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function splitPhoneNumbers(phone) {
      if (!phone) {
        return [];
      }

      return String(phone)
        .split(/[、，,/\s]+/u)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function createImageButton(src, alt, className) {
      return `
        <button class="${className}" type="button" data-full-image="${escapeHTML(src)}" aria-label="${escapeHTML(t('zoomImagePrefix'))}${escapeHTML(alt)}">
          <img src="${escapeHTML(src)}" alt="${escapeHTML(alt)}" loading="lazy">
        </button>
      `;
    }

    function getLocalizedCafeInfo(feature, cafeInfo) {
      if (currentLanguage === 'zh') {
        return cafeInfo || null;
      }

      const infoKey = feature.properties.infoKey || feature.properties.name;
      const englishText = CAFE_INFO_EN[infoKey];

      if (englishText) {
        return parseCafeInfo(englishText, feature.properties.address);
      }

      return {
        title: feature.properties.name,
        intro: t('fallbackIntro')(feature.properties.city, feature.properties.address),
        facts: {},
        address: feature.properties.address,
        xhsUrl: cafeInfo?.xhsUrl || ''
      };
    }

    function buildCafePopup(feature, cafeInfo) {
      const {
        name,
        city,
        address,
        phone,
        imageUrl,
        photos = [],
        stampUrl
      } = feature.properties;
      const localizedInfo = getLocalizedCafeInfo(feature, cafeInfo);
      const info = localizedInfo || {
        title: name,
        intro: t('fallbackIntro')(city, address),
        facts: {},
        address,
        xhsUrl: ''
      };
      const fullIntro = info.intro || t('fallbackIntro')(city, address);
      const shortIntro = getFirstSentence(fullIntro);
      const facts = info.facts || {};
      const recommend = facts['推荐理由'];
      const tryItems = facts['推荐尝试'];
      const hours = facts['营业时间'];
      const restDay = facts['休息日'];
      const reminder = facts['小提醒'];
      const phoneNumbers = splitPhoneNumbers(phone);
      const galleryImages = photos.length ? photos : (imageUrl ? [imageUrl] : []);
      const popupContent = document.createElement('div');

      popupContent.className = 'coffee-popup';
      popupContent.innerHTML = `
        <div class="coffee-popup__body">
          <div class="coffee-popup__heading">
            ${stampUrl ? createImageButton(stampUrl, `${name} ${t('stampAlt')}`, 'coffee-popup__title-stamp') : ''}
            <h3>${escapeHTML(info.title)}</h3>
          </div>
          <div class="coffee-popup__facts">
            ${renderFact(t('recommend'), recommend)}
            ${renderFact(t('tryItems'), tryItems)}
            ${renderCopyFact(t('address'), info.address)}
            ${renderFact(t('hours'), hours)}
            ${renderFact(t('restDay'), restDay)}
            ${renderCopyFact(t('phone'), phoneNumbers)}
            ${renderFact(t('reminder'), reminder)}
          </div>
          ${info.xhsUrl ? `<a class="coffee-popup__link" href="${escapeHTML(info.xhsUrl)}" target="_blank" rel="noopener noreferrer">${escapeHTML(t('xhs'))}</a>` : ''}
        </div>
        ${galleryImages.length ? `
          <div class="coffee-popup__gallery">
            ${galleryImages.map((src, index) => createImageButton(src, `${name} ${t('photoAlt')} ${index + 1}`, 'coffee-popup__photo')).join('')}
          </div>
        ` : ''}
        <div class="coffee-popup__body coffee-popup__body--intro">
          <div class="coffee-popup__intro">
            <p data-intro>${escapeHTML(shortIntro)}</p>
            ${fullIntro !== shortIntro ? `<button class="coffee-popup__expand" type="button" data-expanded="false">${escapeHTML(t('expand'))}</button>` : ''}
          </div>
        </div>
      `;

      const expandButton = popupContent.querySelector('.coffee-popup__expand');
      const introElement = popupContent.querySelector('[data-intro]');
      if (expandButton && introElement) {
        expandButton.addEventListener('click', () => {
          const isExpanded = expandButton.dataset.expanded === 'true';
          introElement.textContent = isExpanded ? shortIntro : fullIntro;
          expandButton.textContent = isExpanded ? t('expand') : t('collapse');
          expandButton.dataset.expanded = String(!isExpanded);
        });
      }

      popupContent.querySelectorAll('[data-copy-value]').forEach((button) => {
        button.addEventListener('click', (event) => {
          copyInfo(button.dataset.copyValue, event.currentTarget);
        });
      });

      popupContent.querySelectorAll('[data-full-image]').forEach((button) => {
        button.querySelector('img').addEventListener('error', () => {
          button.remove();
        });
        button.addEventListener('click', () => {
          openLightbox(button.dataset.fullImage, button.querySelector('img').alt);
        });
      });

      return popupContent;
    }

    // 优先读取 GeoJSON 文件；如果是双击 HTML 导致浏览器拦截本地读取，则使用 JS 里的备用数据
    async function loadGeoJSON(fileName, fallbackData) {
      if (window.location.protocol === 'file:' && fallbackData) return fallbackData;
      try {
        const response = await fetch(fileName, { cache: 'force-cache' });

        if (!response.ok) {
          throw new Error(`无法读取 ${fileName}`);
        }

        return await response.json();
      } catch (error) {
        return fallbackData;
      }
    }

    // 根据 coffee-shops.geojson 创建自定义咖啡店标注和弹窗
    function addCoffeeShopMarkers(coffeeShopData) {
      coffeeShopData.features.forEach(async (feature) => {
        const { name, city, address, phone, iconUrl, imageUrl } = feature.properties;
        const coordinates = feature.geometry.coordinates;

        // 创建一个可自定义图片的 HTML 标注
        const markerElement = document.createElement('div');
        markerElement.className = 'coffee-marker';
        markerElement.innerHTML = `<img src="${escapeHTML(iconUrl)}" alt="${escapeHTML(name)}">`;

        let cafeInfo = null;
        if (feature.properties.infoUrl) {
          const rawText = await loadText(feature.properties.infoUrl, CAFE_INFO_FALLBACK[feature.properties.infoKey]);
          cafeInfo = parseCafeInfo(rawText, address);
        }

        const marker = new maplibregl.Marker({
          element: markerElement,
          anchor: 'bottom'
        })
          .setLngLat(coordinates)
          .addTo(map);

        coffeeMarkers.push({ marker, markerElement, feature });

        // 点击咖啡店图标时，第一次只放大；已经放大后再次点击才显示店铺弹窗
        markerElement.addEventListener('click', (event) => {
          event.preventDefault();
          event.stopPropagation();

          const targetZoom = 15.5;
          const currentZoom = map.getZoom();

          if (currentZoom < targetZoom - 0.1) {
            closeCafeModal();
            map.flyTo({
              center: coordinates,
              zoom: targetZoom,
              duration: 700,
              essential: true
            });
            return;
          }

          map.flyTo({
            center: coordinates,
            zoom: currentZoom,
            duration: 700,
            essential: true
          });
          openCafeModal(buildCafePopup(feature, cafeInfo), { feature, cafeInfo });
        });
      });
    }

    // 地图样式加载完成后，才可以添加自定义数据源和图层
    map.on('load', async () => {
      const [provinceOutlines, cityOutlines, guangdongCities, coffeeShops] = await Promise.all([
        loadGeoJSON('./province-outlines.geojson', window.PROVINCE_OUTLINES),
        loadGeoJSON('./city-outlines.geojson', window.CITY_OUTLINES),
        loadGeoJSON('./guangdong-cities.geojson', window.GUANGDONG_CITIES),
        loadGeoJSON('./coffee-shops.geojson', window.COFFEE_SHOPS)
      ]);

      // 添加省级轮廓数据源：广东、北京、上海
      map.addSource('province-outlines', {
        type: 'geojson',
        data: provinceOutlines
      });

      // 添加广东城市标注点数据源：深圳、惠州、广州
      map.addSource('guangdong-cities', {
        type: 'geojson',
        data: guangdongCities
      });

      // 添加深圳、惠州、广州三个市级轮廓数据源
      map.addSource('city-outlines', {
        type: 'geojson',
        data: cityOutlines
      });

      // 省份半透明填充层，用来突出可点击区域
      map.addLayer({
        id: 'province-fill',
        type: 'fill',
        source: 'province-outlines',
        paint: {
          'fill-color': [
            'match',
            ['get', 'name'],
            '广东省', '#f97316',
            '北京市', '#2563eb',
            '上海市', '#16a34a',
            '#64748b'
          ],
          'fill-opacity': 0.22
        }
      });

      // 省份轮廓线层，让边界更清楚
      map.addLayer({
        id: 'province-line',
        type: 'line',
        source: 'province-outlines',
        paint: {
          'line-color': [
            'match',
            ['get', 'name'],
            '广东省', '#ea580c',
            '北京市', '#1d4ed8',
            '上海市', '#15803d',
            '#334155'
          ],
          'line-width': 2.5
        }
      });

      // 市级半透明填充层，广东放大后可以看到深圳、惠州、广州的范围
      map.addLayer({
        id: 'city-fill',
        type: 'fill',
        source: 'city-outlines',
        minzoom: 4,
        paint: {
          'fill-color': [
            'match',
            ['get', 'name'],
            '深圳市', '#0891b2',
            '惠州市', '#9333ea',
            '广州市', '#dc2626',
            '#0f766e'
          ],
          'fill-opacity': 0.2
        }
      });

      // 市级轮廓线层，让三个城市边界更清楚
      map.addLayer({
        id: 'city-line',
        type: 'line',
        source: 'city-outlines',
        minzoom: 4,
        paint: {
          'line-color': [
            'match',
            ['get', 'name'],
            '深圳市', '#0e7490',
            '惠州市', '#7e22ce',
            '广州市', '#b91c1c',
            '#115e59'
          ],
          'line-width': 2.2,
          'line-dasharray': [2, 1]
        }
      });

      // 广东城市点位图层
      map.addLayer({
        id: 'guangdong-city-points',
        type: 'circle',
        source: 'guangdong-cities',
        paint: {
          'circle-radius': 6,
          'circle-color': '#7c2d12',
          'circle-stroke-width': 2,
          'circle-stroke-color': '#ffffff'
        }
      });

      // 添加咖啡店自定义标注和弹窗
      addCoffeeShopMarkers(coffeeShops);

      const didFocusVisitorCountry = await focusMapByVisitorCountry();
      const provinceBounds = getFeatureCollectionBounds(provinceOutlines);
      if (!didFocusVisitorCountry && !provinceBounds.isEmpty()) {
        map.fitBounds(provinceBounds, {
          padding: {
            top: 80,
            right: 80,
            bottom: 80,
            left: 80
          },
          duration: 0,
          maxZoom: 5
        });
      }

      // 鼠标移到省份区域时，显示手型提示可以点击
      map.on('mouseenter', 'province-fill', () => {
        map.getCanvas().classList.add('clickable-area');
      });

      // 鼠标离开省份区域时，恢复默认鼠标样式
      map.on('mouseleave', 'province-fill', () => {
        map.getCanvas().classList.remove('clickable-area');
      });

      // 鼠标移到市级轮廓区域时，也显示手型提示可以点击
      map.on('mouseenter', 'city-fill', () => {
        map.getCanvas().classList.add('clickable-area');
      });

      // 鼠标离开市级轮廓区域时，恢复默认鼠标样式
      map.on('mouseleave', 'city-fill', () => {
        map.getCanvas().classList.remove('clickable-area');
      });

      // 统一处理点击，避免省级和市级重叠图层互相抢点击
      map.on('click', (event) => {
        const cityFeatures = hasSelectedProvince
          ? queryFeaturesAroundPoint(event.point, ['city-fill', 'city-line'], 10)
          : [];

        if (cityFeatures.length) {
          const city = cityFeatures[0];
          const bounds = getGeometryBounds(city.geometry);

          setCoffeeMarkersVisible(true, city.properties.name);
          map.fitBounds(bounds, {
            padding: 70,
            duration: 900,
            maxZoom: 12.5
          });
          return;
        }

        const provinceFeatures = queryFeaturesAroundPoint(event.point, ['province-fill'], 10);
        if (!provinceFeatures.length) {
          return;
        }

        const province = provinceFeatures[0];
        const provinceName = province.properties.name;
        const bounds = getGeometryBounds(province.geometry);

        setCoffeeMarkersVisible(false);
        hasSelectedProvince = true;
        map.fitBounds(bounds, {
          padding: 60,
          duration: 900,
          maxZoom: provinceName === '广东省' ? 7 : 9
        });
      });

    });
  </script>
</body>
</html>
