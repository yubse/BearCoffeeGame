<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>熊熊咖啡屋地图</title>
    <link rel="icon" type="image/png" href="../static/images/logo.png">
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="map-page">
    <main class="map-waiting">
        <img class="map-waiting-image" src="../static/images/map/waiting.jpg" alt="地图施工中">
        <a class="map-waiting-back" href="/" aria-label="返回咖啡屋">返回咖啡屋</a>
    </main>

    <script>
        document.querySelector('.map-waiting-back')?.addEventListener('click', function (event) {
            if (window.location.protocol !== 'file:') return;
            event.preventDefault();
            window.location.href = '../index.html';
        });
    </script>
</body>

</html>
