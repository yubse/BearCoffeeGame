<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="找到熊熊咖啡屋，关注我们或在线购买。Find us, follow us, or shop online.">
  <title>找到我们 | FIND US</title>
  <link rel="stylesheet" href="../css/site-nav.css?v=20260720-1">
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf4ea;
      --card: #fffdf8;
      --ink: #34261e;
      --muted: #8a7565;
      --line: #ead9c5;
      --accent: #8a5b36;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #fff;
      background-image: url("./qr/bg.png");
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: auto 100vh;
      background-attachment: fixed;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 92px 0 64px;
    }

    header { margin-bottom: 34px; text-align: center; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 42px); }
    h1 span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .18em;
    }
    section + section { margin-top: 40px; }
    h2 { margin: 0 0 16px; font-size: 18px; }
    h2 span {
      margin-left: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 230px));
      grid-auto-rows: max-content;
      align-items: start;
      align-content: start;
      justify-content: center;
      gap: 16px;
    }

    .grid--shop { grid-template-columns: repeat(2, minmax(0, 230px)); }

    .card {
      display: flex;
      flex-direction: column;
      align-self: start;
      width: 100%;
      height: auto;
      min-height: 0;
      padding: 16px 8px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: inherit;
      text-align: center;
      text-decoration: none;
    }

    a.card { transition: transform .16s ease, box-shadow .16s ease; }
    a.card:hover, a.card:focus-visible {
      outline: none;
      background: rgba(255, 253, 248, .72);
      box-shadow: 0 12px 28px rgba(90, 55, 31, .1);
      transform: translateY(-2px);
    }

    .channel-visual {
      display: grid;
      width: 150px;
      height: 150px;
      margin: 0 auto;
      place-items: center;
      flex: none;
    }

    .channel-visual img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }

    .channel-visual--qr img {
      width: 150px;
      border-radius: 12px;
    }

    .channel-visual--icon img { width: 92px; }

    .card p {
      margin: 10px 0 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      main { width: min(520px, calc(100% - 16px)); padding-top: 76px; }
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .grid--shop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { min-width: 0; padding: 8px 2px; border-radius: 12px; }
      .channel-visual { width: 88px; height: 88px; }
      .channel-visual--qr img { width: 88px; }
      .channel-visual--icon img { width: 62px; }
      .card p { font-size: 10px; line-height: 1.35; }
    }
  </style>
  <script src="../js/site-nav.js?v=20260810-3" defer></script>
</head>
<body data-site-page="contact">
  <main>
    <header>
      <h1>找到我们 <span>FIND US</span></h1>
    </header>

    <section aria-labelledby="social-title">
      <h2 id="social-title">关注我们 <span>FOLLOW US</span></h2>
      <div class="grid">
        <article class="card" aria-label="微信扫码添加客服">
          <div class="channel-visual channel-visual--qr">
            <img src="./qr/二维码_wechat.png" alt="微信 WeChat 二维码">
          </div>
          <p>扫码添加客服 · SCAN</p>
        </article>
        <a class="card" href="https://www.xiaohongshu.com/user/profile/6080d624000000000101ee46" target="_blank" rel="noreferrer" aria-label="访问小红书">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/小红书.svg" alt="小红书 RED 图标">
          </div>
          <p>点击访问 · VISIT ↗</p>
        </a>
        <a class="card" href="https://www.instagram.com/planetbear_cn?igsh=MTUxcGRqYTVxOGFjag%3D%3D" target="_blank" rel="noreferrer" aria-label="访问 Instagram">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/instagram.svg" alt="Instagram 图标">
          </div>
          <p>点击访问 · VISIT ↗</p>
        </a>
      </div>
    </section>

    <section aria-labelledby="shop-title">
      <h2 id="shop-title">在线购买 <span>SHOP ONLINE</span></h2>
      <div class="grid grid--shop">
        <a class="card" href="https://planetbear.online" target="_blank" rel="noreferrer" aria-label="访问品牌独立站">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/logo.png" alt="品牌独立站 Official Website 标志">
          </div>
          <p>点击访问 · VISIT ↗</p>
        </a>
        <a class="card" href="https://shop101613755.world.taobao.com/category.htm" target="_blank" rel="noreferrer" aria-label="访问淘宝店铺">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/淘宝.svg" alt="淘宝店铺 Taobao Store 图标">
          </div>
          <p>点击访问 · VISIT ↗</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
