<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="找到熊熊咖啡屋，关注我们或在线购买。Find us, follow us, or shop online.">
  <title>找到我们 | FIND US</title>
  <link rel="stylesheet" href="../css/site-nav.css?v=20260810-2">
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf4ea;
      --card: #fffdf8;
      --ink: #34261e;
      --muted: #8a7565;
      --line: #ead9c5;
      --accent: #8a5b36;
    }

    * { box-sizing: border-box; }

    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      background-color: #fff;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: url("./qr/bg.png") center / cover no-repeat;
      content: "";
      pointer-events: none;
    }

    main {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 76px 0 52px;
    }

    section + section { margin-top: 30px; }
    h2 { margin: 0 0 12px; font-size: 17px; text-align: center; }
    h2 span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 230px));
      grid-auto-rows: max-content;
      align-items: start;
      align-content: start;
      justify-content: center;
      gap: 12px;
    }

    .grid--shop { grid-template-columns: repeat(2, minmax(0, 230px)); }

    .card {
      display: flex;
      flex-direction: column;
      align-self: start;
      width: 100%;
      height: auto;
      min-height: 0;
      padding: 12px 6px;
      border: 0;
      border-radius: 18px;
      background: transparent;
      color: inherit;
      text-align: center;
      text-decoration: none;
    }

    a.card { transition: transform .16s ease, box-shadow .16s ease; }
    a.card:hover, a.card:focus-visible {
      outline: none;
      background: rgba(255, 253, 248, .72);
      box-shadow: 0 12px 28px rgba(90, 55, 31, .1);
      transform: translateY(-2px);
    }

    .channel-visual {
      display: grid;
      width: 130px;
      height: 130px;
      margin: 0 auto;
      place-items: center;
      flex: none;
    }

    .channel-visual img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }

    .channel-visual--qr img {
      width: 130px;
      border-radius: 12px;
    }

    .channel-visual--icon img { width: 78px; }
    .channel-visual--website img { width: 102px; }

    .channel-account {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .channel-action {
      margin: 3px 0 0;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      main { width: min(520px, calc(100% - 16px)); padding: 72px 0 44px; }
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .grid--shop { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card { min-width: 0; padding: 6px 2px; border-radius: 12px; }
      .channel-visual { width: 76px; height: 76px; }
      .channel-visual--qr img { width: 76px; }
      .channel-visual--icon img { width: 52px; }
      .channel-visual--website img { width: 68px; }
      .channel-account { font-size: 9px; overflow-wrap: anywhere; }
      .channel-action { font-size: 8px; line-height: 1.3; }
    }
  </style>
  <script src="../js/site-nav.js?v=20260810-4" defer></script>
</head>
<body data-site-page="contact">
  <main>
    <section aria-labelledby="social-title">
      <h2 id="social-title">关注我们 <span>FOLLOW US</span></h2>
      <div class="grid">
        <article class="card" aria-label="微信扫码添加客服">
          <div class="channel-visual channel-visual--qr">
            <img src="./qr/二维码_wechat.png" alt="微信 WeChat 二维码">
          </div>
          <p class="channel-account">bosspanda520</p>
          <p class="channel-action">扫码添加客服 · SCAN</p>
        </article>
        <a class="card" href="https://www.xiaohongshu.com/user/profile/6080d624000000000101ee46" target="_blank" rel="noreferrer" aria-label="访问小红书">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/小红书.svg" alt="小红书 RED 图标">
          </div>
          <p class="channel-account">@白熊百货</p>
          <p class="channel-action">点击访问 · VISIT ↗</p>
        </a>
        <a class="card" href="https://www.instagram.com/planetbear_cn?igsh=MTUxcGRqYTVxOGFjag%3D%3D" target="_blank" rel="noreferrer" aria-label="访问 Instagram">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/instagram.svg" alt="Instagram 图标">
          </div>
          <p class="channel-account">planetbear_cn</p>
          <p class="channel-action">点击访问 · VISIT ↗</p>
        </a>
      </div>
    </section>

    <section aria-labelledby="shop-title">
      <h2 id="shop-title">在线购买 <span>SHOP ONLINE</span></h2>
      <div class="grid grid--shop">
        <a class="card" href="https://planetbear.online" target="_blank" rel="noreferrer" aria-label="访问品牌独立站">
          <div class="channel-visual channel-visual--icon channel-visual--website">
            <img src="./qr/logo.png" alt="品牌独立站 Official Website 标志">
          </div>
          <p class="channel-account">planetbear.online</p>
          <p class="channel-action">点击访问 · VISIT ↗</p>
        </a>
        <a class="card" href="https://shop101613755.world.taobao.com/category.htm" target="_blank" rel="noreferrer" aria-label="访问淘宝店铺">
          <div class="channel-visual channel-visual--icon">
            <img src="./qr/淘宝.svg" alt="淘宝店铺 Taobao Store 图标">
          </div>
          <p class="channel-account">@白熊百货</p>
          <p class="channel-action">点击访问 · VISIT ↗</p>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
