<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="/contact/">
  <title>找到我们 | FIND US</title>
  <script>
    const contactUrl = window.location.protocol === 'file:' ? 'contact/index.html' : '/contact/';
    window.location.replace(contactUrl);

      document.querySelector('a').href = contactUrl;
    });
  </script>
</head>
<body>

</body>
</html>
