function platformStats(platform,data){
  if(platform==='taobao'){const nums=data.items.map(x=>x[3]||0),sum=nums.reduce((a,b)=>a+b,0),share=sum?Math.round(nums[0]/sum*100)+'%':'不可算';return [[data.items.length,'展示商品'],[sum?fmt(sum):'—','Top10最低销量'],[share,'Top1/Top10']];}
  if(platform==='xiaohongshu')return [[data.items.length,'展示商品'],[data.items[0][1].split('｜')[0].replace('预估',''),'榜首销量'],[data.items.length>=10?'Top10':'当前范围','榜单范围']];
  const sum=data.items.reduce((total,item)=>total+(item[3]||0),0);return [[data.items.length,'展示商品'],[data.items[0]?.[1]||'—','榜首销量'],[sum?fmt(sum):'—','Top10销量下限合计']];
}
function renderProduct(item,i,platform){const title=platform==='taobao'&&item[6]?`<a href="${item[6]}" target="_blank" rel="noreferrer">${item[0]}</a>`:item[0];return `<article class="product"><div class="rank">${i+1}</div><img src="${A+item[2]}" alt="${item[0]}" loading="lazy"><div><div class="product-title">${title}</div><div class="product-meta"><span class="sales">${item[1]}</span>${platform==='taobao'&&item[6]?'<span>点击标题查看淘宝</span>':''}</div></div></article>`;}
function renderPlatform(platform,data){const m=platformMeta[platform];if(!data)return `<article class="platform-card ${m.cls}"><div class="platform-head"><div class="platform-line"><div class="platform-name"><span class="platform-icon">${m.icon}</span>${m.label}</div></div><div class="platform-desc">${m.desc}</div></div><div class="empty"><div><strong>暂无该平台榜单</strong><p>当前数据中没有该品牌的${m.label}榜单，补充同日数据后即可加入比较。</p></div></div></article>`;const stats=platformStats(platform,data),topLabel=`Top ${data.items.length}`,actions=`<div class="head-actions">${platform==='taobao'?`<button class="all-products-btn" data-open-all>查看全部 ${data.totalCount} 件</button>`:''}</div>`;return `<article class="platform-card ${m.cls}"><div class="platform-head"><div class="platform-line"><div class="platform-name"><span class="platform-icon">${m.icon}</span>${m.label} ${topLabel}</div>${actions}</div><div class="platform-desc">${m.desc}</div></div><div class="mini-stats">${stats.map(x=>`<div class="mini-stat"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><div class="products">${data.items.map((x,i)=>renderProduct(x,i,platform)).join('')}</div><div class="analysis"><h3>${m.label}平台分析</h3><ul>${data.analysis.map(x=>`<li>${x}</li>`).join('')}</ul></div></article>`;}
function rank(v,cls){return v==null?'<span style="color:var(--muted)">—</span>':`<span class="rank-pill ${cls}">${v}</span>`}
const compact=value=>String(value||'').toUpperCase().replace(/[^0-9A-Z\u4E00-\u9FFF]/g,'');
const HOT_KEYS=['初遇漂浮瓶','情绪棱镜','记忆定格','今天出去玩','情绪毛毛怪','好彩','WAKUKU','狐狐兔','毛毛潮趣','史迪奇','HELLOKITTY','NOMM','DUIDUIDUI','POUKA','疯狂动物城','蜡笔小新','CRYBABY','DIMOO','SKULLPANDA','星星人','DORA','RAYAN','FARMERBOB','MOLINTA','小幽灵','小黄人','小嗷','SIINONO'];
function findTaobaoUrl(name){const target=compact(name),keys=HOT_KEYS.map(compact).filter(key=>target.includes(key));if(target.includes('NOMM'))keys.push(compact('糯米儿'));let best=null,bestScore=0;(window.TAOBAO_ALL?.[activeBrand]||[]).filter(row=>!row.utility).forEach(row=>{const title=compact(row.title);let score=keys.reduce((sum,key)=>sum+(title.includes(key)?key.length:0),0);if(title.includes(target))score+=target.length*2;if(score>bestScore){bestScore=score;best=row.url}});return bestScore?best:null;}

const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function renderAllProducts(){const query=searchInput.value.trim().toLowerCase(),showUtility=utilityInput.checked;const rows=(window.TAOBAO_ALL?.[activeBrand]||[]).filter(row=>(showUtility||!row.utility)&&(!query||row.title.toLowerCase().includes(query)||row.productId.includes(query)));document.getElementById('dialogSubtitle').textContent=`共 ${rows.length} 件符合条件；销量保留淘宝原始展示口径。`;document.getElementById('allProductList').innerHTML=rows.length?rows.map(row=>`<article class="all-row"><div class="all-rank">${row.cleanRank??row.rawRank}</div><img src="${esc(row.image)}" alt="${esc(row.title)}" loading="lazy"><div class="all-title">${esc(row.title)}${row.utility?'<span class="utility-tag">交易入口</span>':''}</div><div class="all-sales">${esc(row.salesRaw)}</div><a class="buy-link" href="${esc(row.url)}" target="_blank" rel="noreferrer">打开淘宝</a></article>`).join(''):'<div class="dialog-empty">没有符合条件的商品</div>';}
